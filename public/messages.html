<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — JS LENGE TECH</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 15px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 12px;
    }

    .messenger {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: 650px;
    }

    .members {
      border-right: 1px solid #e5e7eb;
      background: #fafafa;
    }

    .members-header {
      padding: 18px;
      border-bottom: 1px solid #e5e7eb;
    }

    .members-header h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    #search {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      outline: none;
    }

    .member {
      padding: 13px 15px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .member:hover,
    .member.active {
      background: #eaf2ff;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .member-name {
      font-weight: bold;
      font-size: 14px;
    }

    .member-country {
      color: #6b7280;
      font-size: 12px;
      margin-top: 3px;
    }

    .chat {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      padding: 15px 18px;
      border-bottom: 1px solid #e5e7eb;
      font-weight: bold;
      min-height: 72px;
      display: flex;
      align-items: center;
    }

    .chat-header small {
      display: block;
      color: #6b7280;
      font-weight: normal;
      margin-top: 4px;
    }

    #messages {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      background: #f8fafc;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      margin-top: 100px;
    }

    .message {
      margin-bottom: 12px;
      display: flex;
    }

    .message.mine {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;
      padding: 10px 13px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 2px 7px rgba(0,0,0,.06);
    }

    .mine .bubble {
      background: #2563eb;
      color: white;
    }

    .time {
      font-size: 10px;
      opacity: .65;
      margin-top: 5px;
    }

    .composer {
      padding: 12px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      resize: none;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 12px;
      font-family: inherit;
      outline: none;
    }

    #sendButton {
      border: none;
      background: #2563eb;
      color: white;
      padding: 0 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    #sendButton:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      font-size: 13px;
      padding: 8px;
      display: none;
    }

    @media (max-width: 700px) {
      .messenger {
        grid-template-columns: 1fr;
        min-height: 750px;
      }

      .members {
        border-right: none;
        border-bottom: 1px solid #e5e7eb;
        max-height: 260px;
        overflow-y: auto;
      }

      .chat {
        min-height: 500px;
      }

      .bubble {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>💬 JS LENGE TECH</h1>
  <a class="back" href="/espace-membre.html">← Espace membre</a>
</header>

<div class="container">

  <div id="status"></div>

  <div class="messenger">

    <aside class="members">

      <div class="members-header">
        <h2>👥 Membres</h2>
        <input
          type="text"
          id="search"
          placeholder="Rechercher un membre..."
        >
      </div>

      <div id="membersList"></div>

    </aside>

    <main class="chat">

      <div class="chat-header">
        <div>
          <span id="chatTitle">Sélectionnez un membre</span>
          <small id="chatCountry"></small>
        </div>
      </div>

      <div id="messages">
        <div class="empty">
          👈 Sélectionnez un membre pour commencer une conversation.
        </div>
      </div>

      <form class="composer" id="messageForm">

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Écrire un message..."
          disabled
        ></textarea>

        <button
          id="sendButton"
          type="submit"
          disabled
        >
          Envoyer
        </button>

      </form>

    </main>

  </div>
</div>

<script>
  const token = localStorage.getItem("jsLengeToken");
  const currentMemberRaw = localStorage.getItem("jsLengeMember");

  if (!token || !currentMemberRaw) {
    window.location.href = "/login.html";
  }

  const currentMember = JSON.parse(currentMemberRaw);

  let members = [];
  let selectedMember = null;

  const membersList = document.getElementById("membersList");
  const messagesBox = document.getElementById("messages");
  const search = document.getElementById("search");
  const chatTitle = document.getElementById("chatTitle");
  const chatCountry = document.getElementById("chatCountry");
  const messageInput = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");
  const messageForm = document.getElementById("messageForm");
  const statusBox = document.getElementById("status");

  function showStatus(text, error = false) {
    statusBox.textContent = text;
    statusBox.style.display = "block";
    statusBox.style.color = error ? "#b91c1c" : "#166534";
    statusBox.style.background = error ? "#fee2e2" : "#dcfce7";

    setTimeout(() => {
      statusBox.style.display = "none";
    }, 3000);
  }

  function authHeaders() {
    return {
      "Authorization": "Bearer " + token,
      "Content-Type": "application/json"
    };
  }

  async function loadMembers() {
    try {
      const response = await fetch("/api/members", {
        headers: {
          "Authorization": "Bearer " + token
        }
      });

      const data = await response.json();

      if (!response.ok || !data.success) {
        throw new Error(data.message || "Impossible de charger les membres.");
      }

      members = data.members || [];

      renderMembers(members);

    } catch (error) {
      showStatus(error.message, true);
    }
  }

  function renderMembers(list) {
    membersList.innerHTML = "";

    const otherMembers = list.filter(
      member => member.id !== currentMember.id
    );

    if (otherMembers.length === 0) {
      membersList.innerHTML = `
        <div style="padding:20px;color:#6b7280;text-align:center;">
          Aucun autre membre pour le moment.
        </div>
      `;
      return;
    }

    otherMembers.forEach(member => {

      const div = document.createElement("div");
      div.className = "member";

      if (selectedMember && selectedMember.id === member.id) {
        div.classList.add("active");
      }

      const initial =
        (member.name || "?").charAt(0).toUpperCase();

      const photo = member.photo
        ? `<img src="${member.photo}" alt="">`
        : initial;

      div.innerHTML = `
        <div class="avatar">${photo}</div>

        <div>
          <div class="member-name">
            ${escapeHtml(member.name || "Membre")}
          </div>

          <div class="member-country">
            ${escapeHtml(member.country || "")}
          </div>
        </div>
      `;

      div.addEventListener("click", () => {
        selectMember(member);
      });

      membersList.appendChild(div);
    });
  }

  function selectMember(member) {
    selectedMember = member;

    chatTitle.textContent = member.name || "Membre";
    chatCountry.textContent = member.country || "";

    messageInput.disabled = false;
    sendButton.disabled = false;

    renderMembers(
      members.filter(m =>
        !search.value ||
        (m.name || "").toLowerCase().includes(
          search.value.toLowerCase()
        )
      )
    );

    loadMessages();
  }

  async function loadMessages() {

    if (!selectedMember) return;

    messagesBox.innerHTML = `
      <div class="empty">
        Chargement des messages...
      </div>
    `;

    try {
      const response = await fetch(
        `/api/messages`,
        {
          headers: {
            "Authorization": "Bearer " + token
          }
        }
      );

      const data = await response.json();

      if (!response.ok || !data.success) {
        throw new Error(
          data.message || "Impossible de charger les messages."
        );
      }

      const allMessages = data.messages || [];

      const conversation = allMessages.filter(message => {

        const sender =
          message.sender_id || message.senderId;

        const receiver =
          message.receiver_id || message.receiverId;

        return (
          (sender === currentMember.id &&
           receiver === selectedMember.id) ||
          (sender === selectedMember.id &&
           receiver === currentMember.id)
        );
      });

      renderMessages(conversation);

    } catch (error) {
      messagesBox.innerHTML = `
        <div class="empty">
          ❌ ${escapeHtml(error.message)}
        </div>
      `;
    }
  }

  function renderMessages(list) {

    if (list.length === 0) {
      messagesBox.innerHTML = `
        <div class="empty">
          Aucun message.<br>
          👋 Commencez la conversation !
        </div>
      `;
      return;
    }

    messagesBox.innerHTML = "";

    list.forEach(message => {

      const sender = message.sender_id || message.senderId;
      const mine = sender === currentMember.id;

      const div = document.createElement("div");
      div.className = "message " + (mine ? "mine" : "");

      const date = message.created_at
        ? new Date(message.created_at).toLocaleString("fr-FR")
        : "";

      div.innerHTML = `
        <div class="bubble">
          <div>
            ${escapeHtml(message.content || "")}
          </div>

          <div class="time">
            ${date}
          </div>

          ${mine ? `
            <button
              class="delete-message"
              data-id="${escapeHtml(message.id)}"
              type="button">
              🗑️ Supprimer
            </button>
          ` : ""}
        </div>
      `;

      messagesBox.appendChild(div);
    });

    document.querySelectorAll(".delete-message").forEach(button => {
      button.addEventListener("click", async () => {

        const messageId = button.dataset.id;

        if (!confirm("Voulez-vous vraiment supprimer ce message ?")) {
          return;
        }

        button.disabled = true;

        try {
          const response = await fetch(
            "/api/messages/" + messageId,
            {
              method: "DELETE",
              headers: authHeaders()
            }
          );

          const data = await response.json();

          if (!response.ok || !data.success) {
            throw new Error(
              data.message || "Impossible de supprimer le message."
            );
          }

          await loadMessages();

        } catch (error) {
          button.disabled = false;
          showStatus(error.message, true);
        }
      });
    });

    messagesBox.scrollTop = messagesBox.scrollHeight;
  }

  messageForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    if (!selectedMember) {
      showStatus("Sélectionnez d'abord un membre.", true);
      return;
    }

    const content = messageInput.value.trim();

    if (!content) return;

    sendButton.disabled = true;

    try {

      const response = await fetch("/api/messages", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({
          receiver_id: selectedMember.id,
          content: content
        })
      });

      const data = await response.json();

      if (!response.ok || !data.success) {
        throw new Error(
          data.message || "Impossible d'envoyer le message."
        );
      }

      messageInput.value = "";

      await loadMessages();

    } catch (error) {
      showStatus(error.message, true);
    }

    sendButton.disabled = false;
  });

  search.addEventListener("input", () => {

    const query = search.value.toLowerCase().trim();

    const filtered = members.filter(member =>
      member.id !== currentMember.id &&
      (
        (member.name || "").toLowerCase().includes(query) ||
        (member.country || "").toLowerCase().includes(query)
      )
    );

    renderMembers(filtered);
  });

  messageInput.addEventListener("keydown", event => {

    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      messageForm.requestSubmit();
    }

  });

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  loadMembers();
</script>

</body>
</html>
